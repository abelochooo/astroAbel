<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Morph | El universo desde cerca!</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
</head>

<body>
    <div id="ubicacionDiv" class="ubicacionDiv">
        <h1 id="ubicacionMensaje"></h1>
        <h4 id="ubicacionUsuario"></h4>
    </div>
    <video id="camara" autoplay playsinline muted></video>
    <canvas id="cieloCamara"></canvas>
    <button id="activar">Activar sensores</button>
    <button id="calibrar">Reiniciar orientación</button>
    <button id="modoBoton">Modo mapa libre</button>
    <button id="buscarObjeto">Encontrar objeto</button>
    <div id="orientacion">
        Dirección: <span id="direccion">-</span><br>
        Altitud: <span id="altitud">-</span>
    </div>
    <div id="fovControl">
        Zoom / FOV: <span id="fovValor">-</span>
        <input
            type="range"
            id="fovSlider"
            min="30"
            max="100"
            step="1"
        >
    </div>
    <div id="objetivo"></div>
    <div id="errorCamara"></div>
    <div id="debug">-</div>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine/astronomy.browser.min.js"></script>
    <script type="module" src="./js/main.js"></script>


</body>
</html>
