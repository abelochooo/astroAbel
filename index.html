<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph | Aprendizaje adaptado a tí.</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ubicacionDiv" class="ubicacionDiv">
        <h1 id="ubicacionMensaje"></h1>
        <h4 id="ubicacionUsuario"></h4>
    </div>  
    <div id="cieloDiv">
        <canvas id="cielo"></canvas>

        <div id="infoCielo">
            <span id="ubi"></span>
            <span id="horaLocal"></span>
        </div>
    </div>
    <video id="camara" autoplay playsinline></video>
    <canvas id="cieloCamara"></canvas>


    <button id="activar">Activar sensores</button>

<div id="orientacion">
    Alpha: <span id="alpha">-</span><br>
    Beta: <span id="beta">-</span><br>
    Gamma: <span id="gamma">-</span>
</div>

<script src="./script.js"></script>
<script>
    document.getElementById("activar").addEventListener("click", async () => {

    alert("¡Funciona!");

    if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permiso = await DeviceOrientationEvent.requestPermission();

        if (permiso !== "granted") {
            alert("Permiso denegado");
            return;
        }
    }

    window.addEventListener("deviceorientation", (e) => {
        document.getElementById("alpha").textContent = e.alpha?.toFixed(1);
        document.getElementById("beta").textContent = e.beta?.toFixed(1);
        document.getElementById("gamma").textContent = e.gamma?.toFixed(1);
    });
});
</script>
</body>
</html>
