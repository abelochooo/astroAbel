<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph | Aprendizaje adaptado a tí.</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ubicacionDiv" class="ubicacionDiv">
        <h1 id="ubicacionMensaje"></h1>
        <h4 id="ubicacionUsuario"></h4>
    </div>  
    <div id="cieloDiv">
        <canvas id="cielo"></canvas>

        <div id="infoCielo">
            <span id="ubi"></span>
            <span id="horaLocal"></span>
        </div>
    </div>
    <video id="camara" autoplay playsinline></video>
    <canvas id="cieloCamara"></canvas>


    <div id="orientacion">
        <div>Alpha: <span id="alpha">-</span>°</div>
        <div>Beta: <span id="beta">-</span>°</div>
        <div>Gamma: <span id="gamma">-</span>°</div>
    </div>

<script src="./script.js"></script>
</body>
</html>
